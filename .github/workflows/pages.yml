# Publishes the static game in web/ to GitHub Pages, so the site root is web/index.html.
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: Version bump level
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Every push to main bumps the version (patch by default, see tools/bump.mjs) and commits it back.
      # Pushes made with GITHUB_TOKEN do not start another run, so this does not loop.
      - name: Bump version
        if: ${{ !startsWith(github.event.head_commit.message, 'Bump version') }}
        run: |
          v=$(node tools/bump.mjs "${{ inputs.level || 'patch' }}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $v"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
